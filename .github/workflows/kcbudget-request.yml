# Budget requests from Microsoft Forms, with no keys stored in GitHub.
#
# Power Automate (customer-owned): "When a new response is submitted" -> "Get response details" ->
# GitHub connector "Create an issue" (signs in with OAuth as a bot/service account that is a repo
# collaborator; no PAT is created or stored in GitHub). Title starts with [kcbudget-request]; the body
# carries the form answers in a ```json block (examples/forms/power-automate-issue-body.md).
#
# This workflow validates the request against budgets/<environment>.json (naming, email domains,
# channel names, pool headroom) and opens a pull request that closes the issue. It uses only the
# built-in GITHUB_TOKEN. Nothing reaches Kubecost until the PR is reviewed and merged.
# Needs: Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
name: kcbudget - request

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: kcbudget-request-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  request:
    # only requests filed by people/accounts with write access (the Power Automate connection account)
    if: >-
      startsWith(github.event.issue.title, '[kcbudget-request]') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add the request to the budget file
        id: req
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          python -m kcbudget request --file 'budgets/{environment}.json' --payload "$GITHUB_EVENT_PATH" \
            --pr-body "$RUNNER_TEMP/pr-body.md" 2>&1 | tee "$RUNNER_TEMP/request.log"
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          FILE: ${{ steps.req.outputs.file }}
          BUDGET: ${{ steps.req.outputs.budget }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          BRANCH="kcbudget/request-$ISSUE"
          printf '\nCloses #%s\n' "$ISSUE" >> "$RUNNER_TEMP/pr-body.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$FILE"
          git commit -m "budget request: $BUDGET" -m "From Microsoft Forms via issue #$ISSUE."
          git push --force origin "$BRANCH"
          if url="$(gh pr view "$BRANCH" --json url -q .url 2>/dev/null)"; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh label create kcbudget-request --color 0E8A16 --description "Budget request from Microsoft Forms" 2>/dev/null || true
            url="$(gh pr create --head "$BRANCH" --base "$BASE" --title "Budget request: $BUDGET" \
                   --body-file "$RUNNER_TEMP/pr-body.md" --label kcbudget-request)"
          fi
          gh issue comment "$ISSUE" --body "Validated. Review and merge to deploy: $url"
      - name: Report a rejected request
        if: failure() && steps.req.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          { echo "This request could not be accepted:"; echo; grep '::error::' "$RUNNER_TEMP/request.log" | sed 's/^::error::/- /'; \
            echo; echo "Edit the issue (or submit the form again) to retry."; } > "$RUNNER_TEMP/reject.md"
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/reject.md"
