# Budget requests from Microsoft Forms.
# Power Automate posts repository_dispatch {event_type: "kcbudget-request", client_payload: {...form answers}}
# (see docs/budgets.md and examples/forms/). This workflow validates the request against the target
# budget file (naming, email domains, channel names, pool headroom) and opens a pull request.
# Nothing reaches Kubecost until the PR is reviewed and merged.
# Needs: Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
name: kcbudget - request

on:
  repository_dispatch:
    types: [kcbudget-request]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kcbudget-request
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pick budget file
        id: target
        env:
          TARGET_ENV: ${{ github.event.client_payload.environment }}
          RESPONSE_ID: ${{ github.event.client_payload.responseId }}
        run: |
          case "$TARGET_ENV" in
            lab|prod) echo "file=budgets/$TARGET_ENV.json" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::client_payload.environment must be lab or prod (got '$TARGET_ENV')"; exit 2 ;;
          esac
          id="$(printf '%s' "${RESPONSE_ID:-$GITHUB_RUN_ID}" | tr -cd 'A-Za-z0-9-' | cut -c1-40)"
          echo "branch=kcbudget/request-${TARGET_ENV}-${id:-$GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
      - name: Add the request to the budget file
        id: req
        env:
          PYTHONPATH: ${{ github.workspace }}
          KCBUDGET_FILE: ${{ steps.target.outputs.file }}
        run: python -m kcbudget request --payload "$GITHUB_EVENT_PATH" --pr-body "$RUNNER_TEMP/pr-body.md"
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.target.outputs.branch }}
          FILE: ${{ steps.target.outputs.file }}
          BUDGET: ${{ steps.req.outputs.budget }}
          REQUESTER: ${{ github.event.client_payload.requester }}
        run: |
          set -euo pipefail
          git config user.name "kcbudget-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$FILE"
          git commit -m "budget request: $BUDGET" -m "Requested by ${REQUESTER:-unknown} via Microsoft Forms."
          git push --force origin "$BRANCH"
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh label create kcbudget-request --color 0E8A16 --description "Budget request from Microsoft Forms" 2>/dev/null || true
            gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" \
              --title "Budget request: $BUDGET" --body-file "$RUNNER_TEMP/pr-body.md" --label kcbudget-request
          fi
